<div class="container">
  <div class="buttons">
    <button (click)="filterProducts('technology')">Show Technology Products</button>
    <button (click)="filterProducts('accessories')">Show Accessories Products</button>
    <button (click)="filterProducts('fashion')">Show Fashion Products</button>
    <button (click)="showAll()">ShowAll</button>
  </div>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Category</th>
      </tr>
    </thead>
    <tbody>
      @for (product of products; track product.id) {
        <tr>
          <td>{{ product.id }}</td>
          <td>{{ product.name }}</td>
          <td>{{ product.price }}</td>
          <td>{{ product.category }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
